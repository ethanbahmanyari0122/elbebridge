<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Modal shop</title>
<style>
 body{font-family:sans-serif;color:#111;background:#fff}
 /* Covers the viewport but blocks nothing — must NOT be treated as a wall. */
 .deco{position:fixed;inset:0;z-index:500;pointer-events:none}
 .news{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.7);
       display:flex;align-items:center;justify-content:center}
 .news .box{background:#fff;padding:24px}
</style></head><body>
<div class="deco"></div>
<div class="news" id="nl"><div class="box">
  <p>Join our newsletter</p>
  <input type="email" aria-label="Email"><button>Subscribe</button>
  <button aria-label="Close" onclick="document.getElementById('nl').remove()">×</button>
</div></div>
<main>
  <h1>Modal shop</h1>
  <nav><a href="/produkt/hemd">Products</a><a href="/impressum">Impressum</a></nav>
  <img src="/a.png"><button></button>
</main>
</body></html>
